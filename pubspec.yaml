name: payment_tracker
description: SMS Payment Tracker - See all your incoming and outgoing payments

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  another_telephony: ^0.4.1     # Maintained fork of telephony for SMS reading
  permission_handler: ^11.3.0 # Runtime permissions
  intl: ^0.19.0               # Date/number formatting
  fl_chart: ^0.68.0           # Charts for spending overview
  sqflite: ^2.3.0             # Local SQLite database
  path: ^1.8.3                # Path utilities for database
  uuid: ^4.0.0                # UUID generation for dynamic categories
  share_plus: ^11.1.0         # Android share sheet for transaction exports
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # sqlite3 v2 avoids native-asset hook failures with SDK paths containing spaces.
  sqflite_common_ffi: ">=2.3.7 <2.4.0"

dependency_overrides:
  # 2.6.x uses a native-asset hook that fails when Flutter is under a Windows path with spaces.
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true
